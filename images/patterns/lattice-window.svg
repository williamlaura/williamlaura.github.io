<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <g fill="none" stroke="#c9a87c" stroke-width="1.2" opacity="0.2">
    <!-- 外框 -->
    <rect x="10" y="10" width="180" height="180" rx="4"/>
    <!-- 米字格 -->
    <line x1="10" y1="10" x2="190" y2="190"/>
    <line x1="190" y1="10" x2="10" y2="190"/>
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
    <!-- 冰裂纹小装饰 -->
    <polyline points="55,10 55,55 10,55"/>
    <polyline points="145,10 145,55 190,55"/>
    <polyline points="55,190 55,145 10,145"/>
    <polyline points="145,190 145,145 190,145"/>
    <!-- 中心圆 -->
    <circle cx="100" cy="100" r="28"/>
    <circle cx="100" cy="100" r="18"/>
  </g>
</svg>